---
deployment:
  tasks:
    # Heal BOTH likely DocumentRoots. Options/Headers/Rewrite often 500 on this host.
    # Clean URLs use physical folders + DirectoryIndex only — no RewriteRule.
    - /bin/bash -lc 'heal(){ local D="$1"; [ -d "$D" ] || return 0; printf "%s\n" "DirectoryIndex index.html" > "$D/.htaccess"; chmod 644 "$D/.htaccess"; rm -f "$D/.htaccess.broken" "$D/.htaccess.bak" 2>/dev/null; true; }; heal /home/signlwzv/thewillowshotels.com; heal /home/signlwzv/public_html'
    - /bin/bash -lc 'stamp(){ local D="$1"; [ -d "$D" ] || return 0; printf "%s\n" "Willows deploy test - $(date -u +%Y-%m-%dT%H:%M:%SZ) - build 20260922m - cpanel-heal" > "$D/deploy-test.txt"; chmod 644 "$D/deploy-test.txt"; }; stamp /home/signlwzv/thewillowshotels.com; stamp /home/signlwzv/public_html'
    # If public_html looks like this site (or is empty of foreign brands), sync full tree from repo checkout.
    - /bin/bash -lc 'SRC=/home/signlwzv/thewillowshotels.com; DST=/home/signlwzv/public_html; if [ -d "$DST" ] && [ -d "$SRC" ]; then if [ ! -f "$DST/index.html" ] || grep -qiE "Willow Nest|Willowshotels|thewillowshotels" "$DST/index.html" 2>/dev/null; then rsync -a --delete --exclude .git --exclude Backup --exclude .cpanel.yml "$SRC"/ "$DST"/; printf "%s\n" "DirectoryIndex index.html" > "$DST/.htaccess"; chmod 644 "$DST/.htaccess"; printf "%s\n" "Willows deploy test - $(date -u +%Y-%m-%dT%H:%M:%SZ) - build 20260922m - public_html-sync" > "$DST/deploy-test.txt"; chmod 644 "$DST/deploy-test.txt"; fi; fi'
    # Best-effort cache wipe (safe if paths missing).
    - /bin/bash -lc 'rm -rf /home/signlwzv/lscache/* /home/signlwzv/thewillowshotels.com/lscache/* /home/signlwzv/public_html/lscache/* /home/signlwzv/tmp/lscache/* 2>/dev/null; true'
